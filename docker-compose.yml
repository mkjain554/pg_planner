services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgplanner
      POSTGRES_PASSWORD: pgplanner_dev
      POSTGRES_DB: pgplanner
    ports:
      - "5432:5432"
    volumes:
      - pgplanner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgplanner -d pgplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgplanner-data:
